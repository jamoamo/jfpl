name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How to derive the release version from the current SNAPSHOT'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Determine versions
        id: versions
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          CURRENT=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Current version: $CURRENT"

          if [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "::error::Version on main is '$CURRENT', expected a -SNAPSHOT version"
            exit 1
          fi

          BASE="${CURRENT%-SNAPSHOT}"
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$CURRENT' is not a three-part X.Y.Z-SNAPSHOT version"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$RELEASE_TYPE" in
            patch) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "::error::Unknown release type '$RELEASE_TYPE'"; exit 1 ;;
          esac

          RELEASE="$MAJOR.$MINOR.$PATCH"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"

          echo "release_version=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"

          {
            echo "| | Version |"
            echo "| --- | --- |"
            echo "| Current | \`$CURRENT\` |"
            echo "| Release (\`$RELEASE_TYPE\`) | \`$RELEASE\` |"
            echo "| Next development | \`$NEXT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if tag already exists
        env:
          TAG: v${{ steps.versions.outputs.release_version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create release branch
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: git checkout -b "release/v$RELEASE_VERSION"

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: mvn -B versions:set -DnewVersion="$RELEASE_VERSION" -DprocessAllModules -DgenerateBackupPoms=false

      - name: Commit and tag release version
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: |
          git commit -am "Release $RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION"

      - name: Build, sign and publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease clean deploy

      - name: Set next development version
        env:
          NEXT_VERSION: ${{ steps.versions.outputs.next_version }}
        run: |
          mvn -B versions:set -DnewVersion="$NEXT_VERSION" -DprocessAllModules -DgenerateBackupPoms=false
          git commit -am "Prepare for next development iteration $NEXT_VERSION"

      - name: Push release branch and tag
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          git push origin "refs/tags/v$RELEASE_VERSION"
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/release/v$RELEASE_VERSION"

      - name: Open release pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: |
          set -euo pipefail
          URL=$(gh pr create \
            --base main \
            --head "release/v$RELEASE_VERSION" \
            --title "Release $RELEASE_VERSION" \
            --body "Automated release commit and next-development version bump for v$RELEASE_VERSION.")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Auto-merge release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr merge --merge --auto --delete-branch "$PR_URL"

      - name: Wait for release pull request to merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            if [[ "$STATE" == "MERGED" ]]; then
              echo "Release pull request merged."
              exit 0
            fi
            if [[ "$STATE" == "CLOSED" ]]; then
              echo "::error::Release pull request was closed without merging."
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for the release pull request to merge (required checks may have failed)."
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            --verify-tag

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-artifacts
          path: |
            **/target/*.jar
            **/target/*.asc
          retention-days: 14
          if-no-files-found: warn
